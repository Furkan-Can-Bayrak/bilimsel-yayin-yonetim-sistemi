<div class="shell">
  <header class="top">
    <a routerLink="/" class="logo">Blog</a>
    <nav class="nav">
      <a routerLink="/">Yazılar</a>
      @if (auth.isLoggedIn()) {
        <a routerLink="/admin">Admin</a>
        <a routerLink="/admin/notifications">Bildirimler</a>
        <span class="user">{{ auth.username() }}</span>
        <button type="button" class="linkish" (click)="logout()">Çıkış</button>
      } @else {
        <a routerLink="/admin/login">Giriş</a>
      }
    </nav>
  </header>
  <main>
    <router-outlet />
  </main>
</div>
