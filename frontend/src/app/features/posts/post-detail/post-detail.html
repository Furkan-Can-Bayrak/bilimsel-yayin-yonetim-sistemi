<section class="page">
  <p class="back">
    <a routerLink="/">← Tüm yazılar</a>
  </p>

  @if (loading()) {
    <p class="muted">Yükleniyor…</p>
  } @else if (error()) {
    <p class="error">{{ error() }}</p>
  } @else if (post(); as p) {
    <article>
      <header>
        <p class="meta">
          <span>{{ p.categoryName }}</span>
          @if (p.publishedAt) {
            <span>· {{ p.publishedAt | date: 'd MMMM y' }}</span>
          }
        </p>
        <h1>{{ p.title }}</h1>
        @if (p.summary) {
          <p class="summary">{{ p.summary }}</p>
        }
      </header>
      <div class="content">{{ p.content }}</div>
    </article>
  }
</section>
